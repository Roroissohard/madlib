<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mad Libs</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Knewave&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Romier's Rad Libs</h1>
        <form id="madlib-form">
            <input type="text" id="noun" placeholder="Enter a noun" required>
            <input type="text" id="verb" placeholder="Enter a verb" required>
            <input type="text" id="adjective" placeholder="Enter an adjective" required>
            <input type="text" id="adverb" placeholder="Enter an adverb" required>
            <button type="submit" id="madlibResult">Generate Mad Lib</button>
        </form>
    <script src="script.js"></script>
</body>
</html>
